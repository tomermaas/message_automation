<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Login – Message Automation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; }
    label { display:block; margin-top: 0.75rem; }
    input[type="text"], input[type="password"] { width: 100%; padding: .5rem; }
    button { margin-top: 1rem; padding: .6rem 1rem; }
    .msg { color: #b00020; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>Login</h1>
  {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}

  <form method="post" action="/login">
    <label>Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <label>
      <input type="checkbox" name="headless" value="true" {% if headless_default %}checked{% endif %}>
      Show automation browser window
    </label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
