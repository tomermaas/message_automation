<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kidum Automation</title>
<style>
  :root {
    --bg:#0b1020; --panel:#111937; --muted:#9aa4b2; --text:#e8edf4;
    --accent:#f70035; --accent-2:#33c2ff; --ok:#16a34a; --warn:#eab308;
    --err:#ef4444; --border:#1f2a4b;
  }
  * { box-sizing:border-box; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans","Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji"; }
  body { margin:0; background:linear-gradient(180deg,#0b1020 0%,#0e1430 60%,#0b1020 100%); color:var(--text); }
  .wrap { max-width:900px; margin:40px auto; padding:0 16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  h1 { font-size:24px; margin:0 0 16px; }
  .row { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
  .row-3 { display:grid; gap:12px; grid-template-columns:1fr 1fr 1fr; }
  label { font-size:14px; color:var(--muted); }
  input[type="text"], input[type="password"], select {
    width:100%; padding:10px 12px; border-radius:10px;
    border:1px solid var(--border); background:#0c1430; color:var(--text); outline:none;
  }
  .btn {
    appearance:none; border:none; border-radius:12px; padding:10px 14px; cursor:pointer; font-weight:600;
    color:white; background:linear-gradient(90deg,var(--accent) 0%,#ff5a83 100%); box-shadow:0 4px 14px rgba(247,0,53,.35);
  }
  .btn.secondary { background:linear-gradient(90deg,var(--accent-2) 0%,#5fe0ff 100%); box-shadow:0 4px 14px rgba(51,194,255,.3); }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .muted { color:var(--muted); }
  .pill { border:1px solid var(--border); border-radius:999px; padding:6px 10px; font-size:13px; color:var(--muted); }
  .status-ok { color:var(--ok); font-weight:600; }
  .status-err { color:var(--err); font-weight:600; }
  .status-warn { color:var(--warn); font-weight:600; }
  .mt16 { margin-top:16px; } .mt8 { margin-top:8px; }
  .grid { display:grid; gap:16px; }
  .hidden { display:none; }
  small { color:var(--muted); }
  hr { border:none; border-top:1px solid var(--border); }
</style>
</head>
<body
  data-logged-in="{{ 'true' if logged_in else 'false' }}"
  data-display-name="{{ display_name or '' }}"
  data-teacher-id="{{ teacher_id or '' }}"
  data-selected-id="{{ selected_id or '' }}"
>
  <div class="wrap">
    <div class="card">
      <h1>🔐 כניסה למערכת אוטומציה</h1>

      <div class="grid">
        <div class="row">
          <div>
            <label>שם משתמש</label>
            <input id="username" type="text" autocomplete="username" />
          </div>
          <div>
            <label>סיסמה</label>
            <input id="password" type="password" autocomplete="current-password" />
          </div>
        </div>

        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <button id="btnLogin" class="btn">התחברות</button>
          <button id="btnLogout" class="btn ghost">התנתקות</button>
          <span id="loginMsg" class="muted"></span>
        </div>
      </div>

      <hr class="mt16" />

      <div class="grid mt16">
        <div class="row-3">
          <div class="pill">סטטוס: <span id="status" class="status-warn">לא מחובר</span></div>
          <div class="pill">שם מוצג: <span id="displayName">—</span></div>
          <div class="pill">Teacher ID: <span id="teacherId">—</span></div>
        </div>
      </div>

      <div id="course-block" class="mt16 hidden">
        <h3>בחירת קורס</h3>
        <div class="row">
          <div>
            <label for="courseSelect">קורסים זמינים</label>
            <select id="courseSelect">
              <option value="">— אין נתונים —</option>
            </select>
            <div class="mt8" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <button id="btnLoadCourses" class="btn secondary">רענן רשימת קורסים</button>
              <small id="coursesMsg" class="muted"></small>
              <small id="courseStatus" class="muted"></small>
            </div>
          </div>
          <div>
            <label>מידע</label>
            <div class="muted" style="line-height:1.6">
              • לאחר התחברות, רשימת הקורסים נטענת אוטומטית מה-API.<br />
              • אם ה-API ייכשל, תהיה נפילה לגיבוי דרך ה-UI (איטי יותר).<br />
              • הבחירה נשמרת בצד השרת עד לבחירה חדשה.
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
async function $get(url) {
  const r = await fetch(url, { credentials: 'include' });
  if (!r.ok) throw new Error(`GET ${url} -> ${r.status}`);
  return r.json();
}
async function $post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const text = await r.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch(e){ data = { ok:false, error:text }; }
  if (!r.ok) {
    const msg = (data && data.detail) ? data.detail : (`HTTP ${r.status}`);
    throw new Error(msg);
  }
  return data;
}

function showCourseBlock(show) {
  document.getElementById('course-block').style.display = show ? 'block' : 'none';
}

function setStatus(s) {
  const el = document.getElementById('status');
  el.classList.remove('status-ok','status-err','status-warn');
  if (s === true) { el.textContent = 'מחובר'; el.classList.add('status-ok'); }
  else if (s === false) { el.textContent = 'לא מחובר'; el.classList.add('status-warn'); }
  else { el.textContent = s; el.classList.add('status-err'); }
}

function setProfile(displayName, teacherId) {
  const dn = document.getElementById('displayName');
  const tid = document.getElementById('teacherId');
  if (dn) dn.textContent = displayName || '—';
  if (tid) tid.textContent = teacherId || '—';
}

function fillCourses(items, selectedId) {
  const sel = document.getElementById('courseSelect');
  sel.innerHTML = '';
  const empty = document.createElement('option');
  empty.value = '';
  empty.textContent = '— בחרו קורס —';
  sel.appendChild(empty);

  if (!items || items.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '— אין נתונים —';
    sel.appendChild(opt);
    return;
  }
  for (const c of items) {
    const opt = document.createElement('option');
    opt.value = c.id ?? '';
    opt.textContent = c.name ?? '';
    if (selectedId != null && c.id == selectedId) opt.selected = true;
    sel.appendChild(opt);
  }
}

async function loadCourses(auto=false) {
  const st = document.getElementById('courseStatus');
  if (st) st.textContent = auto ? 'טוען קורסים...' : 'מרענן קורסים...';
  try {
    // IMPORTANT: ask for full objects (id + name), not names_only
    const res = await $get('/courses');
    if (res && res.ok) {
      fillCourses(res.data || [], res.selected_id);
      showCourseBlock(true);
      if (st) st.textContent = `נמצאו ${res.data?.length ?? 0} קורסים.`;
    } else {
      if (st) st.textContent = 'שגיאה בטעינת קורסים.';
    }
  } catch (e) {
    if (st) st.textContent = 'שגיאה: ' + (e.message || e);
  }
}

async function refreshStatusAndMaybeLoad() {
  try {
    const s = await $get('/status');
    setStatus(!!s.logged_in);
    setProfile(s.display_name, s.teacher_id);
    showCourseBlock(!!s.logged_in);
    if (s.logged_in) await loadCourses(true);
  } catch (e) {
    setStatus(String(e.message || e));
  }
}

async function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const m = document.getElementById('loginMsg');
  m.textContent = 'מתחבר...';
  try {
    const data = await $post('/login', { username: u, password: p });
    m.textContent = 'התחברות הצליחה.';
    setStatus(true);
    setProfile(data.display_name, data.teacher_id);
    await loadCourses(true);
  } catch (e) {
    setStatus(false);
    m.textContent = 'שגיאה: ' + (e.message || e);
  }
}

async function doLogout() {
  const m = document.getElementById('loginMsg');
  m.textContent = 'מתנתק...';
  try {
    await $post('/logout', {});
    m.textContent = 'התנתקת.';
    setStatus(false);
    setProfile(null, null);
    fillCourses([]);
    showCourseBlock(false);
  } catch (e) {
    m.textContent = 'שגיאה: ' + (e.message || e);
  }
}

document.getElementById('btnLogin')?.addEventListener('click', doLogin);
document.getElementById('btnLogout')?.addEventListener('click', doLogout);

// Persist selection
document.getElementById('courseSelect')?.addEventListener('change', async (ev) => {
  const cid = parseInt(ev.target.value, 10);
  if (!cid) return;
  const st = document.getElementById('courseStatus');
  if (st) st.textContent = 'שומר בחירה...';
  try {
    const r = await $post('/select_course', { course_id: cid });
    if (st) st.textContent = 'נשמר ✔';
  } catch (e) {
    if (st) st.textContent = 'שגיאה: ' + (e.message || e);
  }
});

refreshStatusAndMaybeLoad();
</script>
</body>
</html>
